<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Using Placeholder Images</title>
  <style>
    pre {
      background-color: black;
      color: white;
      padding: 1rem;
    }

    img {
      display: block;
      width: 50vw;
      height: auto;
      margin-bottom: 2rem;
    }
  </style>
</head>

<body>
  <h1>On using placeholder images</h1>

  <ul>
    <li>
      <a href="https://placehold.co/" target="_blank" rel="noreferrer noopenner">Placehold.co</a>
    </li>
    <li>
      <a href="https://loremflickr.com/" target="_blank" rel="noreferrer noopenner">Lorem Flickr</a>
    </li>
    <li>
      <a href="https://placebear.com/" target="_blank" rel="noreferrer noopenner">Placebear.com</a>
    </li>
    <li>
      <a href="https://picsum.photos/" target="_blank" rel="noreferrer noopenner">Lorem Picsum</a>
    </li>
  </ul>

  <h2>Simple Plachold.co usage</h2>

  <img src="https://placehold.co/600x600" width="600" height="600" alt="" srcset="https://placehold.co/300x300 300w,
               https://placehold.co/600x600 600w,
               https://placehold.co/1200x1200 1200w">

  <h2>Customized Plachold.co usage</h2>

  <!-- With Customization -->
  <img src="https://placehold.co/600x600" width="600" height="600" alt="" srcset="https://placehold.co/300x300?text=Placeholders\nHelp 300w,
               https://placehold.co/600x600?text=Placeholders\nHelp 600w,
               https://placehold.co/1200x1200?text=Placeholders\nHelp 1200w">

  <h2>Lorem Flickr usage</h2>

  <!-- With Customization -->
  <img src="https://loremflickr.com/320/240/dog" width="320" height="240" alt="" srcset="https://loremflickr.com/640/480/dog 640w,
               https://loremflickr.com/1280/960/dog 1280w">

</body>

</html>
